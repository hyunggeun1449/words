<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#A9D3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF6; --line:#CFE3F5; --margin:#F4A6A6; --ink:#24324A; --soft:#6B7A90;
  --sun:#FFD23F; --sky:#3A8DDE; --btn-ink:#24324A; --card:#FFFFFF; --bg:#EAF4FC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E2633; --line:#2C3B52; --margin:#7A3E48; --ink:#F1F4F9; --soft:#A9B6C8;
    --sun:#FFD23F; --sky:#7DB8F0; --btn-ink:#24324A; --card:#263042; --bg:#151B25; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1E2633; --line:#2C3B52; --margin:#7A3E48; --ink:#F1F4F9; --soft:#A9B6C8;
  --sun:#FFD23F; --sky:#7DB8F0; --btn-ink:#24324A; --card:#263042; --bg:#151B25; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gaegu","Jua",system-ui,sans-serif;font-size:20px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:2.2rem;margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--soft);margin:0 0 20px}
.upload{display:flex;flex-direction:column;gap:12px;background:var(--card);border:3px dashed var(--sky);border-radius:20px;padding:18px;text-align:center}
.upload img{max-width:100%;max-height:220px;border-radius:12px;object-fit:contain;margin:0 auto}
.btn{font-family:"Jua",system-ui,sans-serif;font-size:1.15rem;border:none;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--sun);color:var(--btn-ink);box-shadow:0 4px 0 #D9A900}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9A900}
.btn.alt{background:var(--sky);color:#fff;box-shadow:0 4px 0 #23649F}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.spk:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.pickwrap{position:relative;display:flex}
.pickwrap .btn{flex:1}
.pickwrap input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.status{min-height:1.4em;color:var(--soft)}
.note{margin-top:24px;background:var(--paper);border-radius:6px 20px 20px 6px;padding:18px 16px 18px 52px;position:relative;
  background-image:linear-gradient(var(--paper) 46px,transparent 46px),repeating-linear-gradient(var(--paper) 0 47px,var(--line) 47px 48px);
  box-shadow:0 6px 18px rgba(36,50,74,.12)}
.note::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:var(--margin)}
.note h2{font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:1.4rem;margin:0 0 6px;height:34px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;min-height:48px}
.word{font-weight:700;font-size:1.35rem}
.mean{color:var(--soft);flex:1}
.spk{width:40px;height:40px;border-radius:50%;border:none;background:var(--sun);font-size:1.2rem;cursor:pointer;flex:none;display:grid;place-items:center}
.spk.on{background:var(--sky)}
.empty{color:var(--soft)}
.clear{margin-top:14px;background:none;border:none;color:var(--soft);font-family:inherit;font-size:1rem;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion: reduce){.btn:active{transform:none}}
textarea{width:100%;min-height:160px;font-family:inherit;font-size:1.1rem;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);color:var(--ink)}
.review[hidden]{display:none}
.review{display:flex;flex-direction:column;gap:10px;text-align:left}
.hint{font-size:.95rem;color:var(--soft);margin:0}
.del{background:none;border:none;color:var(--soft);font-size:1.1rem;cursor:pointer;width:32px;height:40px}
</style>
</head>
<body>
<main>
  <h1>단어장 ✏️</h1>
  <p class="sub">단어장 사진을 찍으면 글자를 읽어 줘요.</p>

  <section class="upload">
    <img id="preview" alt="올린 단어장 사진" hidden>
    <div class="pickwrap">
      <span class="btn alt" aria-hidden="true">📷 단어장 사진 올리기</span>
      <input id="file" type="file" accept="image/*" aria-label="단어장 사진 올리기">
    </div>
    <div class="status" id="status" aria-live="polite"></div>

    <div class="review" id="review" hidden>
      <p class="hint">읽은 글자를 확인해요. 틀린 건 고치고, 한 줄에 하나씩 <b>영어 - 뜻</b>으로 적어 주세요.</p>
      <textarea id="draft" spellcheck="false"></textarea>
      <button class="btn" id="add">📒 단어장에 넣기</button>
    </div>
  </section>

  <section class="note">
    <h2>내 단어 메모장</h2>
    <ul id="list"></ul>
    <p class="empty" id="empty">아직 단어가 없어요. 사진을 올려 볼까요?</p>
    <button class="clear" id="clear" hidden>단어 모두 지우기</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const KEY = "soyeon-words-v1";
let words = [];
try { words = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { words = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(words)); } catch (e) {} };

const $ = id => document.getElementById(id);
const fileIn = $("file"), status = $("status"), preview = $("preview");

function render() {
  const ul = $("list"); ul.innerHTML = "";
  words.forEach((w, i) => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.className = "word"; a.textContent = w.word;
    const b = document.createElement("span"); b.className = "mean"; b.textContent = w.meaning;
    const s = document.createElement("button"); s.className = "spk"; s.textContent = "🔊";
    s.setAttribute("aria-label", w.word + " 발음 듣기");
    s.onclick = () => speak(w.word, s);
    const d = document.createElement("button"); d.className = "del"; d.textContent = "✕";
    d.setAttribute("aria-label", w.word + " 지우기");
    d.onclick = () => { words.splice(i, 1); save(); render(); };
    li.append(a, b, s, d); ul.append(li);
  });
  $("empty").hidden = words.length > 0;
  $("clear").hidden = words.length === 0;
}

function speak(text, btn) {
  if (!("speechSynthesis" in window)) { status.textContent = "이 기기에서는 소리를 낼 수 없어요."; return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("en"));
  if (v) u.voice = v;
  btn.classList.add("on");
  u.onend = u.onerror = () => btn.classList.remove("on");
  speechSynthesis.speak(u);
}

// 사진 글자에서 "영어 - 뜻" 줄만 골라내기
function toLines(text) {
  const out = [];
  text.split(/\n+/).forEach(line => {
    const en = line.match(/[A-Za-z][A-Za-z'\-]*(?: [A-Za-z][A-Za-z'\-]*)*/);
    if (!en || en[0].length < 2) return;
    const ko = line.slice(en.index + en[0].length).match(/[가-힣][가-힣\s,~()·]*/);
    out.push(en[0].trim() + " - " + (ko ? ko[0].trim() : ""));
  });
  return out.join("\n");
}

fileIn.onchange = async () => {
  const f = fileIn.files[0]; if (!f) return;
  preview.src = URL.createObjectURL(f); preview.hidden = false;
  if (!window.Tesseract) { status.textContent = "글자 읽기 도구를 못 불러왔어요. 인터넷 연결을 확인해 주세요."; return; }
  status.textContent = "글자를 읽고 있어요… 처음엔 1분쯤 걸려요 🔍";
  try {
    const worker = await Tesseract.createWorker("eng+kor", 1, {
      logger: m => { if (m.status === "recognizing text") status.textContent = `글자를 읽고 있어요… ${Math.round(m.progress * 100)}%`; }
    });
    const { data } = await worker.recognize(f);
    await worker.terminate();
    const lines = toLines(data.text);
    $("draft").value = lines;
    $("review").hidden = false;
    status.textContent = lines ? "다 읽었어요! 아래에서 확인해 주세요." : "단어를 못 찾았어요. 밝은 곳에서 가까이 찍어 볼까요?";
  } catch (e) {
    status.textContent = "글자를 읽지 못했어요. 사진을 다시 올려 볼까요?";
  }
  fileIn.value = "";
};

$("add").onclick = () => {
  const have = new Set(words.map(w => w.word.toLowerCase()));
  let n = 0;
  $("draft").value.split("\n").forEach(line => {
    const [w, ...rest] = line.split(/\s*[-–:]\s*/);
    const word = (w || "").trim();
    if (!word || have.has(word.toLowerCase())) return;
    words.push({ word, meaning: rest.join(" ").trim() }); have.add(word.toLowerCase()); n++;
  });
  save(); render();
  $("review").hidden = true; preview.hidden = true;
  status.textContent = `단어 ${n}개를 넣었어요! 🎉`;
};

$("clear").onclick = () => { if (confirm("단어를 모두 지울까요?")) { words = []; save(); render(); } };
render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
